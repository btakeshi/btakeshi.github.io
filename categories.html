---
layout: page
title: Categories
permalink: /categories/
---
<ul>
{% for category in site.categories %}
  <li id="{{ category[0] }}">
    <h3>{{ category[0] }}</h3>
    <ul>
      {% for post in category[1] %}
        <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> ({{ post.date | date: "%Y-%m-%d" }})</li>
      {% endfor %}
    </ul>
  </li>
{% endfor %}
</ul>
